# manages web portal pod and exposes it on port 30500
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: web-app
        image: doc-app:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: app-config
        volumeMounts:
        - name: firebase-key-volume
          mountPath: /secrets
          readOnly: true
      volumes:
      - name: firebase-key-volume
        secret:
          secretName: firebase-secret
---
apiVersion: v1
kind: Service
metadata:
  name: web-app-service
spec:
  type: NodePort
  selector:
    app: web-app
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30500