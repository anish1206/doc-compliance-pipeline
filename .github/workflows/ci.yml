name: Continuous Integration & Compliance Test Suite

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up Python environment
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # 3. Install dependencies & Pytest
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pypdf functions-framework minio cryptography firebase-admin

    # 4. Run Automated Unit Tests on PII Detection Logic
    - name: Run Pytest Unit Tests
      run: |
        pytest tests/

    # 5. Set up Terraform CLI
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3

    # 6. Validate Terraform Infrastructure Code
    - name: Validate Terraform Syntax
      run: |
        cd terraform
        terraform init -backend=false
        terraform validate

    # 7. Test Docker Image Builds
    - name: Test Docker Build - Web App
      run: docker build -t doc-app:ci ./src/app

    - name: Test Docker Build - Scanner Engine
      run: docker build -t doc-scanner:ci ./src/function